[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-transcript"
version = "0.1.0"
description = "Caption extraction and local Apple Silicon transcription"
requires-python = ">=3.15,<3.16"
dependencies = [
    "mlx-whisper==0.4.3",
    "mlx==0.32.4",
    "numpy",
    "huggingface-hub",
    "opencc-python-reimplemented",
    "yt-dlp[default]",
    "youtube-transcript-api",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
video-transcript = "video_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
